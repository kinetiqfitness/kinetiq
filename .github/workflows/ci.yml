name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Figure out which parts of the monorepo changed, so each PR only
  # runs the checks it needs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      cv: ${{ steps.filter.outputs.cv }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cv:
              - 'cv/**'
              - 'shared/**'
            backend:
              - 'backend/**'
              - 'shared/**'
            mobile:
              - 'mobile/**'
              - 'shared/**'
            web:
              - 'web/**'

  cv:
    needs: changes
    if: needs.changes.outputs.cv == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff pyyaml numpy
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: ruff check .
      - run: pytest -q || [ $? -eq 5 ]   # exit 5 = no tests yet; don't fail on that

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: ruff check .
      - run: pytest -q || [ $? -eq 5 ]

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test
        run: |
          if [ ! -f pubspec.yaml ]; then echo "No Flutter project yet"; exit 0; fi
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint and build
        run: |
          if [ ! -f package.json ]; then echo "No web project yet"; exit 0; fi
          npm ci
          npm run lint --if-present
          npm run build --if-present

  # The ONE check to mark as required in branch protection.
  # It passes when every job that ran passed (skipped jobs are fine).
  ci-ok:
    needs: [changes, cv, backend, mobile, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "A check failed"; exit 1
          fi
